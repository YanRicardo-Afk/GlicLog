<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GlicoLog — Criar conta</title>

  <link rel="stylesheet" href="../css/styleLogin.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/accessibility.css">

  <script src="../js/theme.js"></script>
  <script src="../js/accessibility.js"></script>
</head>

<body>

  <main class="app">
    <div class="brand" aria-label="GlicoLog — Diário glicêmico">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2"></path>
          <path d="M12 6v6l4 2"></path>
        </svg>
      </div>

      <div>
        <div class="brand-name">GlicoLog</div>
        <div class="brand-sub">Diário glicêmico</div>
      </div>
    </div>

    <section class="card" aria-labelledby="cadastroTitle">
      <div class="glucose-bar">
        <span>Crie sua conta para acompanhar suas medições</span>
      </div>

      <h1 class="card-title" id="cadastroTitle">Criar conta</h1>
      <p class="card-sub">Preencha seus dados para começar</p>

      <div
        id="cad-toast"
        class="toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

      <form id="cadastro-form" novalidate>
        <div class="field">
          <label for="cad-nome">Nome</label>

          <input
            type="text"
            id="cad-nome"
            name="name"
            placeholder="Seu nome"
            autocomplete="name"
            aria-describedby="err-cad-nome"
            required
            autofocus
          >

          <span class="field-error" id="err-cad-nome">
            Informe seu nome
          </span>
        </div>

        <div class="field">
          <label for="cad-email">E-mail</label>

          <input
            type="email"
            id="cad-email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
            inputmode="email"
            aria-describedby="err-cad-email"
            required
          >

          <span class="field-error" id="err-cad-email">
            Insira um e-mail válido
          </span>
        </div>

        <div class="field">
          <label for="cad-senha">Senha</label>

          <input
            type="password"
            id="cad-senha"
            name="password"
            placeholder="Mínimo de 6 caracteres"
            autocomplete="new-password"
            minlength="6"
            aria-describedby="err-cad-senha strength-label"
            required
          >

          <span class="field-error" id="err-cad-senha">
            A senha deve ter pelo menos 6 caracteres
          </span>

          <div
            class="strength-bar"
            aria-hidden="true"
          >
            <span class="strength-seg" id="s1"></span>
            <span class="strength-seg" id="s2"></span>
            <span class="strength-seg" id="s3"></span>
            <span class="strength-seg" id="s4"></span>
          </div>

          <span
            class="strength-label"
            id="strength-label"
            aria-live="polite"
          ></span>
        </div>

        <div class="field">
          <label for="cad-confirma">Confirmar senha</label>

          <input
            type="password"
            id="cad-confirma"
            name="passwordConfirmation"
            placeholder="Digite a senha novamente"
            autocomplete="new-password"
            aria-describedby="err-cad-confirma"
            required
          >

          <span class="field-error" id="err-cad-confirma">
            As senhas não coincidem
          </span>
        </div>

        <button
          class="btn-primary"
          id="btn-cadastro"
          type="submit"
        >
          Criar conta
        </button>
      </form>

      <div class="divider" aria-hidden="true">
        <hr>
        <span>ou</span>
        <hr>
      </div>

      <p class="link-row">
        Já tem conta?
        <a href="login.html">Entrar</a>
      </p>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/cadastro.js"></script>

</body>
</html>
