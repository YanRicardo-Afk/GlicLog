<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GlicoLog — Login</title>

  <link rel="stylesheet" href="../css/styleLogin.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/accessibility.css">

  <script src="../js/theme.js"></script>
  <script src="../js/accessibility.js"></script>
</head>

<body>

  <main class="app">
    <div class="brand" aria-label="GlicoLog — Diário glicêmico">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2"></path>
          <path d="M12 6v6l4 2"></path>
        </svg>
      </div>

      <div>
        <div class="brand-name">GlicoLog</div>
        <div class="brand-sub">Diário glicêmico</div>
      </div>
    </div>

    <section class="card" aria-labelledby="loginTitle">
      <div class="glucose-bar">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>

        <span>Zona segura: 70–180 mg/dL</span>
      </div>

      <h1 class="card-title" id="loginTitle">Bem-vindo de volta</h1>
      <p class="card-sub">Entre na sua conta para continuar</p>

      <div
        id="login-toast"
        class="toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">E-mail</label>

          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
            inputmode="email"
            aria-describedby="err-login-email"
            required
            autofocus
          >

          <span class="field-error" id="err-login-email">
            Insira um e-mail válido
          </span>
        </div>

        <div class="field">
          <label for="login-senha">Senha</label>

          <input
            type="password"
            id="login-senha"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            aria-describedby="err-login-senha"
            required
          >

          <span class="field-error" id="err-login-senha">
            A senha é obrigatória
          </span>
        </div>

        <button class="btn-primary" id="btn-login" type="submit">
          Entrar
        </button>
      </form>

      <div class="divider" aria-hidden="true">
        <hr>
        <span>ou</span>
        <hr>
      </div>

      <p class="link-row">
        Não tem conta?
        <a href="cadastro.html">Criar conta</a>
      </p>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>

</body>
</html>
